name: home-server-lab

# Local, illustrative Compose stack. Not a production deployment.
services:
  demo-app:
    image: nginx:stable-alpine
    restart: unless-stopped
    networks:
      - proxy

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - demo-app
    ports:
      # Loopback-only: local laboratory access, not exposed to the LAN/Internet.
      - "127.0.0.1:8080:80"
    volumes:
      - ./caddy/Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab_db
      POSTGRES_USER: lab_user
      # Fails configuration if the value is unset or empty.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env file}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data

  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - data

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  # Only reverse proxy and demo app are attached here.
  proxy: {}
  # Isolated from external routing; no published database/cache ports.
  data:
    internal: true
